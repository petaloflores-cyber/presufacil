
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PresuFácil WhatsApp</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background: #f2f5f3;
      color: #222;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 {
      color: #16834a;
      text-align: center;
    }

    p { line-height: 1.5; }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #16834a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #compartir { background: #128c7e; }

    #resultado {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f2f5f3;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PresuFácil 📋</h1>
    <p>Prepará un presupuesto y compartilo por WhatsApp.</p>

    <label for="negocio">Tu nombre o negocio</label>
    <input id="negocio" placeholder="Ej.: Juan Electricidad">

    <label for="cliente">Nombre del cliente</label>
    <input id="cliente" placeholder="Ej.: Juan Pérez">

    <label for="fecha">Fecha del presupuesto</label>
    <input id="fecha" type="date">

    <label for="trabajo">Trabajo a realizar</label>
    <textarea id="trabajo" rows="3"
      placeholder="Describí el trabajo"></textarea>

    <label for="manoObra">Mano de obra ($)</label>
    <input id="manoObra" type="number"
      min="0" step="0.01" value="0">

    <label for="materiales">Materiales ($)</label>
    <input id="materiales" type="number"
      min="0" step="0.01" value="0">

    <label for="telefono">WhatsApp del cliente (opcional)</label>
    <input id="telefono" type="tel"
      placeholder="Ej.: 54911XXXXXXXX">

    <button onclick="generarPresupuesto()">
      Generar presupuesto
    </button>

    <div id="resultado" hidden></div>

    <button id="compartir" hidden onclick="compartirWhatsApp()">
      Enviar por WhatsApp
    </button>
  </div>

  <script>
    let mensajePresupuesto = "";

    // Coloca la fecha local de hoy.
    const hoy = new Date();
    const fechaLocal = new Date(
      hoy.getTime() - hoy.getTimezoneOffset() * 60000
    ).toISOString().slice(0, 10);

    document.getElementById("fecha").value = fechaLocal;

    function generarPresupuesto() {
      const negocio =
        document.getElementById("negocio").value.trim();
      const cliente =
        document.getElementById("cliente").value.trim();
      const fecha =
        document.getElementById("fecha").value;
      const trabajo =
        document.getElementById("trabajo").value.trim();
      const manoInput =
        document.getElementById("manoObra").value;
      const materialesInput =
        document.getElementById("materiales").value;
      const manoObra = Number(manoInput);
      const materiales = Number(materialesInput);
      const telefono =
        document.getElementById("telefono").value.trim();

      if (!negocio) {
        alert("Ingresá tu nombre o el de tu negocio.");
        return;
      }

      if (!trabajo) {
        alert("Describí el trabajo a realizar.");
        return;
      }

      if (!fecha) {
        alert("Seleccioná la fecha del presupuesto.");
        return;
      }

      if (
        !manoInput.trim() ||
        !materialesInput.trim() ||
        !Number.isFinite(manoObra) ||
        !Number.isFinite(materiales) ||
        manoObra < 0 ||
        materiales < 0
      ) {
        alert("Ingresá importes válidos, iguales o mayores que cero.");
        return;
      }

      const total = manoObra + materiales;

      const formato = new Intl.NumberFormat("es-AR", {
        style: "currency",
        currency: "ARS"
      });

      const fechaPartes = fecha.split("-");
      const fechaMostrar =
        fechaPartes[2] + "/" +
        fechaPartes[1] + "/" +
        fechaPartes[0];

      mensajePresupuesto =
        "📋 PRESUPUESTO - PresuFácil\n\n" +
        "Profesional: " + negocio + "\n" +
        "Cliente: " + (cliente || "No especificado") + "\n" +
        "Fecha: " + fechaMostrar + "\n\n" +
        "Trabajo a realizar:\n" + trabajo + "\n\n" +
        "Mano de obra: " + formato.format(manoObra) + "\n" +
        "Materiales: " + formato.format(materiales) + "\n" +
        "--------------------------\n" +
        "TOTAL: " + formato.format(total) + "\n\n" +
        "Gracias por tu consulta.";

      document.getElementById("resultado").textContent =
        mensajePresupuesto;
      document.getElementById("resultado").hidden = false;
      document.getElementById("compartir").hidden = false;

      window.telefonoPresupuesto = telefono;
    }

    function compartirWhatsApp() {
      if (!mensajePresupuesto) {
        alert("Primero generá el presupuesto.");
        return;
      }

      const telefono = window.telefonoPresupuesto || "";
      const numero = telefono.replace(/\D/g, "");

      const url = numero
        ? "https://wa.me/" + numero +
          "?text=" + encodeURIComponent(mensajePresupuesto)
        : "https://wa.me/?text=" +
          encodeURIComponent(mensajePresupuesto);

      window.open(url, "_blank");
    }
  </script>
</body>
</html>
